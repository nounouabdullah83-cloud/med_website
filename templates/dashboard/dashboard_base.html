{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <style>
        .dashboard-layout {
            display: flex;
            min-height: calc(100vh - var(--nav-h));
            background: var(--bg);
        }

        /* Sidebar */
        .dashboard-sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: sticky;
            top: var(--nav-h);
            height: calc(100vh - var(--nav-h));
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-weight: 500;
            transition: all var(--transition);
        }

        .sidebar-link:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .sidebar-link.active {
            background: var(--accent-pale);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content */
        .dashboard-content {
            flex: 1;
            padding: 40px;
            max-width: 100%;
            overflow-x: hidden;
        }

        .dashboard-page-header {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .dashboard-page-header h1 {
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        .dashboard-page-header p {
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .dashboard-layout { flex-direction: column; }
            .dashboard-sidebar {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                overflow-x: auto;
                padding: 12px 24px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .sidebar-link { white-space: nowrap; padding: 8px 16px; }
            .dashboard-content { padding: 24px; }
        }
    </style>
    {% block dashboard_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="dashboard-layout">
    <aside class="dashboard-sidebar">
        <a href="{% url 'dashboard:show_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name in 'show_dashboard,add_booking_manual' %}active{% endif %}">
            <span class="sidebar-icon">📊</span>
            Overview
        </a>
        <a href="{% url 'dashboard:all_bookings' %}" class="sidebar-link {% if request.resolver_match.url_name == 'all_bookings' %}active{% endif %}">
            <span class="sidebar-icon">📅</span>
            Bookings
        </a>
        <a href="{% url 'dashboard:show_all_services' %}" class="sidebar-link {% if request.resolver_match.url_name in 'show_all_services,add_service,update_service,delete_service' %}active{% endif %}">
            <span class="sidebar-icon">🩺</span>
            Services
        </a>
        <a href="{% url 'dashboard:manage_schedule' %}" class="sidebar-link {% if request.resolver_match.url_name in 'manage_schedule,update_business_day' %}active{% endif %}">
            <span class="sidebar-icon">⏰</span>
            Schedule
        </a>
        <a href="{% url 'statictics:business_info' %}" class="sidebar-link {% if request.resolver_match.url_name == 'business_info' %}active{% endif %}">
            <span class="sidebar-icon">📈</span>
            Statistics
        </a>
        
    </aside>

    <main class="dashboard-content">
        {% block dashboard_content %}{% endblock %}
    </main>
</div>

<!-- Shared Booking Note Modal -->
{% endblock %}
