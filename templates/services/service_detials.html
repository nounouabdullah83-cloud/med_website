{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="service-detail">
  <div class="service-detail__container">

    <div class="service-detail__media">
      <div class="service-detail__image-card">
        <img src="{{ service.image.url }}" alt="{{ service.name }}" loading="lazy">
      </div>
    </div>

    <div class="service-detail__content">
      <span class="service-detail__eyebrow">Service</span>
      <h1 class="service-detail__title">{{ service.name }}</h1>

      <div class="service-detail__price">
        <span class="service-detail__price-amount">{{ service.price }}</span>
        <span class="service-detail__price-label">per session</span>
      </div>

      <p class="service-detail__description">{{ service.description }}</p>

      <div class="service-detail__actions">
        <a href="{% url 'booking:submit_booking' %}#booking_section" class="btn-book">
          <svg class="btn-book__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 2V5M16 2V5M3.5 9H20.5M5 4H19C20.1046 4 21 4.89543 21 6V20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V6C3 4.89543 3.89543 4 5 4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Book now</span>
        </a>
        <a href="tel:{{ clinic_phone|default:'' }}" class="btn-contact">Call to ask a question</a>
      </div>

      <ul class="service-detail__meta">
        <li><span class="dot"></span>Certified specialists</li>
        <li><span class="dot"></span>Confirmed within 24h</li>
      </ul>
    </div>

  </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
  :root {
    --primary-color: #1A365D;
    --primary-hover: #122543;
    --secondary-color: #0D9488;
    --secondary-hover: #0F766E;
    --surface: #FFFFFF;
    --surface-muted: #F7FAF9;
    --border-soft: #E3E9E7;
    --text-muted: #5C6B70;
  }

  .service-detail {
    background: var(--surface-muted);
    padding: 64px 24px;
  }

  .service-detail__container {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    gap: 56px;
    align-items: start;
  }

  /* ---------- Media ---------- */
  .service-detail__media {
    position: sticky;
    top: 32px;
  }

  .service-detail__image-card {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(26, 54, 93, 0.06), 0 12px 32px -12px rgba(26, 54, 93, 0.18);
    aspect-ratio: 4 / 5;
  }

  .service-detail__image-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    box-shadow: inset 0 0 0 1px rgba(13, 148, 136, 0.12);
    pointer-events: none;
  }

  .service-detail__image-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 56px;
    height: 56px;
    background: var(--secondary-color);
    border-radius: 0 0 20px 0;
    z-index: 1;
  }

  .service-detail__image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- Content ---------- */
  .service-detail__content {
    padding-top: 8px;
  }

  .service-detail__eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--secondary-color);
    background: rgba(13, 148, 136, 0.09);
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .service-detail__title {
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.15;
    font-weight: 700;
    color: var(--primary-color);
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .service-detail__price {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 24px;
  }

  .service-detail__price-amount {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary-color);
  }

  .service-detail__price-label {
    font-size: 14px;
    color: var(--text-muted);
  }

  .service-detail__description {
    font-size: 16px;
    line-height: 1.75;
    color: var(--text-muted);
    margin: 0 0 32px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border-soft);
  }

  /* ---------- Actions ---------- */
  .service-detail__actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    margin-bottom: 28px;
  }

  .btn-book {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--secondary-color);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 12px;
    box-shadow: 0 8px 20px -8px rgba(13, 148, 136, 0.55);
    transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }

  .btn-book:hover {
    background: var(--secondary-hover);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -8px rgba(13, 148, 136, 0.6);
  }

  .btn-book:active {
    transform: translateY(0);
  }

  .btn-book:focus-visible {
    outline: 2px solid var(--primary-color);
    outline-offset: 3px;
  }

  .btn-book__icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .btn-contact {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-color);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.18s ease, color 0.18s ease;
  }

  .btn-contact:hover {
    border-color: var(--primary-color);
  }

  .btn-contact:focus-visible {
    outline: 2px solid var(--primary-color);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- Meta list ---------- */
  .service-detail__meta {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }

  .service-detail__meta li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .service-detail__meta .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--secondary-color);
    flex-shrink: 0;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .service-detail__container {
      grid-template-columns: 1fr;
      gap: 32px;
    }

    .service-detail__media {
      position: static;
    }

    .service-detail__image-card {
      aspect-ratio: 16 / 10;
    }
  }

  @media (max-width: 480px) {
    .service-detail {
      padding: 40px 16px;
    }

    .btn-book {
      width: 100%;
      justify-content: center;
    }

    .service-detail__actions {
      flex-direction: column;
      align-items: stretch;
    }

    .btn-contact {
      text-align: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-book {
      transition: none;
    }
  }
</style>
{% endblock %}
